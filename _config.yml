title: "Computer Vision — The Complete Guide"
description: "From Pixels to Predictions: Understanding, building, and deploying ML-based computer vision systems. A comprehensive reference for practitioners and researchers."
baseurl: "/vision"
url: "https://karam-nus.github.io"

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: true

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

include:
  - README.md

